[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/lake-csv"
  status = 200

# Per-lake paths (/lake-buchanan etc.) are client-side routes, not real
# files — hand every unmatched request to the SPA shell.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
